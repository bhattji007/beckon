<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beckon — Draft 4 · Notch Island</title>
<link rel="stylesheet" href="../render/harness.css">
<style>
/* ---- Draft 4: Notch Island ---- */
/* Everything here is static styling only. NO transitions / animations — render(t) drives every value. */

/* the physical notch */
#notch{position:absolute;left:50%;top:0;width:200px;height:32px;margin-left:-100px;background:#000;border-radius:0 0 14px 14px}

/* the island pill that grows out of the notch */
#island{position:absolute;left:50%;top:0;background:#000;overflow:hidden;transform-origin:50% 0;
  box-shadow:0 10px 40px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.5);color:#fff;font-size:13px}
#island .ring{position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}

/* idle wing dots */
#island .wing{position:absolute;top:0;height:32px;width:36px;display:flex;align-items:center;justify-content:center}
#island .wing.l{left:0}#island .wing.r{right:0}
#island .wing i{display:block;width:7px;height:7px;border-radius:50%}

/* card content (fixed 520 wide, centered) */
#island .content{position:absolute;left:50%;top:0;width:520px;margin-left:-260px;height:100%}
.card{position:absolute;left:0;top:0;width:520px;padding:18px 20px 0 20px}
.card .blob{position:absolute;left:20px;top:18px;width:56px;height:56px;border-radius:17px;display:flex;align-items:center;justify-content:center;
  font-family:"SF Mono",ui-monospace,Menlo,monospace;font-weight:700;font-size:15px;color:#fff;letter-spacing:-.5px}
.card .blob.indigo{background:linear-gradient(145deg,#7c7ff5,#4f52d6);box-shadow:0 6px 18px rgba(99,102,241,.35)}
.card .blob.emerald{background:linear-gradient(145deg,#2fd39a,#0b9a6c);box-shadow:0 6px 18px rgba(16,185,129,.35)}
.card .body{margin-left:72px;width:408px;position:relative}
.card .hdr{display:flex;align-items:center;gap:8px;height:20px;white-space:nowrap}
.card .name{font-size:14px;font-weight:600;letter-spacing:-.1px}
.card .host{font-size:11px;color:rgba(255,255,255,.55);padding:1px 7px;border:1px solid rgba(255,255,255,.14);border-radius:6px;line-height:15px}
.card .kind{margin-left:auto;font-size:11px;color:rgba(255,255,255,.55);display:flex;align-items:center;gap:6px}
.card .kind b{display:inline-block;width:6px;height:6px;border-radius:50%}
.card .req{margin-top:10px;font-size:13px;color:#fff;line-height:1.4}
.card .code{display:inline-block;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12.5px;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;white-space:nowrap}
.card .meta{color:rgba(255,255,255,.55);font-size:12px;margin-top:4px;line-height:1.4}
.card .q{font-size:13px;font-weight:600;margin-top:10px}
.card .actions{display:flex;gap:8px;margin-top:12px}
.pbtn{height:28px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.12);font-size:12px;font-weight:500;display:inline-flex;align-items:center;white-space:nowrap;position:relative;color:#fff}
.pbtn.primary.indigo{background:#6366f1}.pbtn.primary.emerald{background:#10b981}
.pbtn .fr{position:absolute;inset:-3px;border-radius:17px;box-shadow:0 0 0 1.5px rgba(255,255,255,.85),0 0 0 4px rgba(255,255,255,.18);opacity:0}
.pbtn .fl{position:absolute;inset:0;border-radius:14px;background:#fff;opacity:0}
.opts{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.opt{height:30px;border-radius:9px;background:rgba(255,255,255,.07);display:flex;align-items:center;padding:0 10px;font-size:12.5px;gap:8px;position:relative}
.opt .n{width:16px;height:16px;border-radius:5px;background:rgba(255,255,255,.1);font-size:10px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.7)}
.opt .rec{margin-left:auto;font-size:10.5px;color:rgba(255,255,255,.5)}
.opt .hl{position:absolute;inset:0;border-radius:9px;background:rgba(16,185,129,.35);box-shadow:inset 0 0 0 1px #10b981;opacity:0}
.field{margin-top:10px;height:32px;border-radius:10px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);display:flex;align-items:center;padding:0 11px;font-size:12.5px;white-space:nowrap;overflow:hidden;position:relative}
.field .ph{color:rgba(255,255,255,.4)}
.field .tx{color:#fff}
.field .cr{display:inline-block;width:1.5px;height:15px;background:#fff;margin-left:1px;vertical-align:-3px}
.field .fr{position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7);opacity:0}
.sent{position:absolute;left:92px;right:20px;top:73px;height:32px;border-radius:10px;background:rgba(99,102,241,.22);box-shadow:inset 0 0 0 1px rgba(99,102,241,.6);display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;color:#fff;opacity:0}
.sent i{display:inline-block;width:14px;height:14px;border-radius:50%;background:#6366f1;font-style:normal;font-size:10px;text-align:center;line-height:14px}

/* bottom edge of island: hint + page dots */
#island .hint{position:absolute;left:0;right:0;bottom:11px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;color:rgba(255,255,255,.55);white-space:nowrap}
#island .hint .kbd{font-size:10.5px;padding:0 6px;line-height:16px;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
#island .pages{position:absolute;left:20px;bottom:13px;display:flex;gap:5px;align-items:center}
#island .pages i{display:block;width:6px;height:6px;border-radius:50%;background:#fff}
#island .plus{position:absolute;left:46px;bottom:8px;height:16px;padding:0 6px;border-radius:8px;background:rgba(255,255,255,.16);font-size:10px;line-height:16px;font-weight:600;color:#fff;display:flex;align-items:center}

/* multi strip */
#strip{position:absolute;left:0;top:0;width:1040px;height:100%}
#strip .card{position:absolute;top:0}
#strip .card.p2{left:520px}

/* hotkey press indicator (floating near island) */
#keyhint{position:absolute;left:50%;top:0;margin-left:-62px;width:124px;height:30px;border-radius:15px;background:rgba(20,20,26,.85);backdrop-filter:blur(14px);box-shadow:0 0 0 1px rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:#fff;opacity:0}
#keyhint .kbd{font-size:11px}

/* video extras */
.bg-video .tc{position:absolute;right:60px;bottom:62px;color:#fff;font-size:13px;opacity:.75;font-variant-numeric:tabular-nums}
.bg-video .dim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 70%,rgba(0,0,0,.6) 100%)}
.bg-video .slide{position:absolute;left:50%;top:50%;width:760px;height:420px;margin:-230px 0 0 -380px;border-radius:14px;background:linear-gradient(160deg,#1b2447,#0a0f22);box-shadow:0 30px 80px rgba(0,0,0,.6);padding:40px 48px;color:#fff}
.bg-video .slide .h{font-size:30px;font-weight:700;letter-spacing:-.6px;margin-bottom:14px}
.bg-video .slide .l{height:12px;border-radius:6px;background:rgba(255,255,255,.14);margin-top:14px}
.bg-video .slide .code{position:absolute;left:48px;right:48px;bottom:40px;height:150px;border-radius:10px;background:rgba(0,0,0,.45);padding:16px 18px;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:13px;line-height:1.75;color:#b7c0ff}
.bg-video .slide .code span{color:#f5a7c7}
</style>
</head>
<body>
<script src="../render/harness.js"></script>
<script>
window.DRAFT = {
  title: 'Notch Island',
  duration: 42500,
  bg: 'video',
  markup: `
    <div id="notch"></div>
    <div id="island">
      <div class="wing l"><i id="dotA" class="c-indigo"></i></div>
      <div class="wing r"><i id="dotB" class="c-emerald"></i></div>
      <div class="content">

        <!-- EVENT A: permission -->
        <div class="card" id="cA">
          <div class="blob indigo">&gt;_</div>
          <div class="body">
            <div class="hdr"><span class="name">tm-reco-app</span><span class="host">Ghostty</span><span class="kind"><b class="c-indigo"></b>Permission · Bash</span></div>
            <div class="req">Claude wants to run <span class="code">npm test -- --coverage</span></div>
            <div class="actions">
              <div class="pbtn primary indigo" id="aAllow">Allow<div class="fr"></div><div class="fl"></div></div>
              <div class="pbtn">Always for this project</div>
              <div class="pbtn">Deny</div>
            </div>
          </div>
        </div>

        <!-- EVENT B: question -->
        <div class="card" id="cB">
          <div class="blob emerald">&lt;/&gt;</div>
          <div class="body">
            <div class="hdr"><span class="name">portfolio</span><span class="host">VS Code</span><span class="kind"><b class="c-emerald"></b>Question · Deploy target</span></div>
            <div class="q">Where should I deploy the preview?</div>
            <div class="opts">
              <div class="opt" id="opt1"><span class="n">1</span>Cloudflare Pages<span class="rec">recommended</span><div class="hl"></div></div>
              <div class="opt"><span class="n">2</span>Vercel</div>
              <div class="opt"><span class="n">3</span>Skip deploy</div>
            </div>
          </div>
        </div>

        <!-- EVENT C: finished + reply -->
        <div class="card" id="cC">
          <div class="blob indigo">&gt;_</div>
          <div class="body">
            <div class="hdr"><span class="name">tm-reco-app</span><span class="host">Ghostty</span><span class="kind"><b class="c-indigo"></b>Finished</span></div>
            <div class="meta" style="margin-top:8px;color:#fff">Fixed 3 failing tests · coverage 71% → 84% · 4 files changed</div>
            <div class="field" id="fC"><span class="ph">Reply to tm-reco-app…</span><span class="tx"></span><span class="cr"></span><div class="fr"></div></div>
          </div>
          <div class="sent" id="sentC"><i>✓</i>Sent → tm-reco-app</div>
        </div>

        <!-- MULTI: strip of two -->
        <div id="strip">
          <div class="card p1">
            <div class="blob indigo">&gt;_</div>
            <div class="body">
              <div class="hdr"><span class="name">tm-reco-app <span style="color:rgba(255,255,255,.45);font-weight:400">/ tests</span></span><span class="host">Ghostty</span><span class="kind"><b class="c-indigo"></b>Permission · Bash</span></div>
              <div class="req">Subagent wants to run <span class="code">rm -rf .coverage</span></div>
              <div class="actions">
                <div class="pbtn primary indigo" id="mAllow">Allow<div class="fr"></div><div class="fl"></div></div>
                <div class="pbtn">Always for this project</div>
                <div class="pbtn">Deny</div>
              </div>
            </div>
          </div>
          <div class="card p2">
            <div class="blob emerald">&lt;/&gt;</div>
            <div class="body">
              <div class="hdr"><span class="name">portfolio</span><span class="host">VS Code</span><span class="kind"><b class="c-emerald"></b>Finished</span></div>
              <div class="meta" style="margin-top:8px;color:#fff">Preview deployed → portfolio-preview.pages.dev · 2 routes</div>
              <div class="actions" style="margin-top:12px">
                <div class="pbtn primary emerald" id="mDone">Done<div class="fr"></div><div class="fl"></div></div>
                <div class="pbtn">Reply…</div>
                <div class="pbtn">Open</div>
              </div>
            </div>
          </div>
        </div>

        <div class="plus" id="plus">+1</div>
        <div class="pages" id="pages"><i id="pg1"></i><i id="pg2"></i></div>
        <div class="hint" id="hint"><span class="kbd" id="hk">⌥ Space</span><span id="ht">to answer</span></div>
      </div>
      <div class="ring" id="ring"></div>
    </div>
    <div id="keyhint"><span class="kbd" id="khk">⌥ Space</span><span id="kht">pressed</span></div>
  `,

  setup(H){
    // enrich the video background a little (static)
    const v=document.querySelector('.bg-video');
    const slide=H.el('div','slide',`<div class="h">Swift Concurrency in Practice</div><div class="l" style="width:62%"></div><div class="l" style="width:40%"></div>
      <div class="code">let island = <span>await</span> session.nextEvent()<br>guard <span>case</span> .permission(<span>let</span> req) = island <span>else</span> { <span>return</span> }<br>reply(.allow, to: req)</div>`);
    v.insertBefore(slide, v.querySelector('.ttl'));
    v.insertBefore(H.el('div','dim'), slide);
    v.appendChild(H.el('div','tc','1:02:14 / 2:11:40'));
    this.$={
      bar:document.querySelector('.bg-video .bar i'), tc:document.querySelector('.bg-video .tc'),
      island:document.getElementById('island'), ring:document.getElementById('ring'),
      dotA:document.getElementById('dotA'), dotB:document.getElementById('dotB'),
      cA:document.getElementById('cA'), cB:document.getElementById('cB'), cC:document.getElementById('cC'), strip:document.getElementById('strip'),
      aAllow:document.getElementById('aAllow'), mAllow:document.getElementById('mAllow'), mDone:document.getElementById('mDone'),
      opt1:document.getElementById('opt1'), fC:document.getElementById('fC'), sentC:document.getElementById('sentC'),
      plus:document.getElementById('plus'), pages:document.getElementById('pages'), pg1:document.getElementById('pg1'), pg2:document.getElementById('pg2'),
      hint:document.getElementById('hint'), hk:document.getElementById('hk'), ht:document.getElementById('ht'),
      keyhint:document.getElementById('keyhint'), khk:document.getElementById('khk'), kht:document.getElementById('kht')
    };
  },

  render(t,H){
    const $=this.$;
    const IDLE_W=236, IDLE_H=32, OPEN=560, CLOSE=480;

    // ---- events timeline (ms) ----
    const EV={
      A:{open:6000,  close:12600, W:520, H:164, card:$.cA, hot:10600, press:12150},
      B:{open:14600, close:18500, W:520, H:214, card:$.cB, click:17750},
      C:{open:19400, close:26100, W:520, H:152, card:$.cC, hot:20700, typeStart:21400, press:24700},
      M:{open:27200, close:33900, W:520, H:166, card:$.strip, hot:29000, press:30400, swipe:30800, press2:33300}
    };
    const cards=[$.cA,$.cB,$.cC,$.strip];
    for(const c of cards){c.style.opacity=0;c.style.visibility='hidden'}

    // ---- video keeps playing ----
    const vp=0.38+ (t/42500)*0.045; $.bar.style.width=(vp*100)+'%';
    const secs=3734+Math.floor(t/1000); const h=Math.floor(secs/3600), m=Math.floor(secs%3600/60), s=secs%60;
    $.tc.textContent=`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} / 2:11:40`;

    // ---- island geometry ----
    let w=IDLE_W, hh=IDLE_H, sy=1, active=null, contentOp=0, openP=0;
    for(const k in EV){
      const e=EV[k];
      if(t>=e.open && t<e.close+CLOSE){
        active=e;
        if(t<e.close){
          const p=H.prog(t,e.open,OPEN,'spring'); openP=p;
          w=H.lerp(IDLE_W,e.W,p); hh=H.lerp(IDLE_H,e.H,p);
          contentOp=H.prog(t,e.open+220,260);
        }else{
          const q=H.clamp((t-e.close)/CLOSE); const ez=H.ease.out(q);
          w=H.lerp(e.W,IDLE_W,ez); hh=H.lerp(e.H,IDLE_H,ez);
          sy=1-0.1*Math.sin(Math.PI*q);          // squash to .9 then settle
          contentOp=1-H.clamp((t-e.close)/170);
          openP=1-ez;
        }
        break;
      }
    }
    const hp=H.clamp((hh-IDLE_H)/(130));
    const r=H.lerp(14,28,hp);
    $.island.style.width=Math.max(IDLE_W, w)+'px';
    $.island.style.height=Math.max(IDLE_H, hh)+'px';
    $.island.style.marginLeft=(-Math.max(IDLE_W,w)/2)+'px';
    $.island.style.borderRadius=`0 0 ${r}px ${r}px`;
    $.island.style.transform=`scaleY(${sy})`;
    $.island.style.boxShadow= hp>0.05 ? `0 ${12*hp}px ${48*hp}px rgba(0,0,0,${.6*hp}),0 2px 6px rgba(0,0,0,.5)` : 'none';

    // idle dots breathing
    const dotOp=1-H.clamp(openP*3);
    const bA=0.55+0.4*Math.sin(t/950), bB=0.55+0.4*Math.sin(t/1100+2.1);
    $.dotA.style.opacity=dotOp*bA; $.dotA.style.transform=`scale(${0.85+0.25*bA})`;
    $.dotB.style.opacity=dotOp*bB; $.dotB.style.transform=`scale(${0.85+0.25*bB})`;

    // ---- focus state (keyboard) ----
    let focused=false, hkPress=0;
    if(active){
      active.card.style.visibility='visible'; active.card.style.opacity=contentOp;
      if(active.hot!=null){ focused = t>=active.hot+180 && t<active.close; hkPress=H.window(t,active.hot,active.hot+900,120,260); }
    }
    $.ring.style.boxShadow= focused ? 'inset 0 0 0 1.5px rgba(255,255,255,.35)' : 'inset 0 0 0 1px rgba(255,255,255,.14)';
    $.ring.style.opacity=contentOp;

    // hint at bottom edge
    const glow=0.5+0.5*Math.sin(t/420);
    $.hint.style.opacity=contentOp;
    if(active===EV.B && !focused){ $.hk.textContent='⌥ Space'; $.ht.textContent='or click to answer'; }
    else if(active===EV.C && focused && t>=EV.C.press){ $.hk.textContent='✓'; $.ht.textContent='sent · focus back to video'; }
    else if(active===EV.C && focused){ $.hk.textContent='↵'; $.ht.textContent='send · Esc back to video'; }
    else if(active===EV.M && focused && t>=EV.M.swipe){ $.hk.textContent='↵'; $.ht.textContent='Done · Esc back to video'; }
    else if(focused){ $.hk.textContent='↵'; $.ht.textContent='Allow · Esc back to video'; }
    else { $.hk.textContent='⌥ Space'; $.ht.textContent='to answer'; }
    $.hk.style.boxShadow= focused ? 'none' : `0 0 ${6+10*glow}px rgba(255,255,255,${.25+.35*glow})`;
    $.hk.style.background= focused ? 'rgba(255,255,255,.1)' : `rgba(255,255,255,${.12+.1*glow})`;

    // floating "pressed" indicator (appears just under the island when hotkey pressed)
    $.keyhint.style.opacity=hkPress;
    $.keyhint.style.top=(hh*sy+14)+'px';
    $.keyhint.style.transform=`translateY(${(1-hkPress)*-6}px)`;

    // ---- EVENT A: focus ring on Allow, press flash ----
    const A=EV.A;
    $.aAllow.querySelector('.fr').style.opacity = (active===A && focused) ? 1 : 0;
    $.aAllow.querySelector('.fl').style.opacity = active===A ? 0.9*H.window(t,A.press,A.press+320,40,280) : 0;
    $.aAllow.style.transform = (active===A && t>=A.press && t<A.press+120) ? 'scale(.95)' : 'scale(1)';

    // ---- EVENT B: cursor click on Cloudflare ----
    const B=EV.B;
    // option 1 center on screen: island top 0, card padding 18, hdr 20, q(10+18), opts margin 8 -> top ~ 74, height 30 -> cy 89; x: content left = 720-260+20+72 = 552 .. +408 → cx ~ 640
    const o1={x:600,y:90};
    $.opt1.querySelector('.hl').style.opacity = active===B ? H.window(t,B.click,B.close+200,60,400)*0.95 : 0;
    $.opt1.style.transform = (active===B && t>=B.click && t<B.click+120) ? 'scale(.985)' : 'scale(1)';

    // ---- EVENT C: typing & sent ----
    const C=EV.C;
    const reply='great — also update the README test section';
    const typed=H.typed(t,reply,C.typeStart,22);
    const cFocused = active===C && focused;
    $.fC.querySelector('.ph').style.display = typed.length||cFocused&&t>=C.typeStart ? 'none':'inline';
    $.fC.querySelector('.tx').textContent=typed;
    $.fC.querySelector('.cr').style.opacity = (cFocused && t<C.press && H.caret(t)) ? 1 : 0;
    $.fC.querySelector('.fr').style.opacity = cFocused && t<C.press ? 1 : 0;
    const sentOp = active===C ? H.window(t,C.press+80,C.close+200,180,200) : 0;
    $.sentC.style.opacity=sentOp; $.sentC.style.transform=`translateY(${(1-H.clamp(sentOp*2))*6}px)`;
    $.fC.style.opacity= active===C ? 1-sentOp : 1;

    // ---- MULTI: strip swipe, pages, +1 ----
    const M=EV.M;
    const sw=H.prog(t,M.swipe,520,'inOut');
    $.strip.style.transform=`translateX(${-520*sw}px)`;
    $.plus.style.opacity = active===M ? contentOp*(1-H.clamp((t-M.swipe)/200)) : 0;
    $.pages.style.opacity = active===M ? contentOp : 0;
    $.pg1.style.opacity = H.lerp(1,0.3,sw); $.pg2.style.opacity = H.lerp(0.3,1,sw);
    $.pg1.style.transform=`scale(${H.lerp(1,.8,sw)})`; $.pg2.style.transform=`scale(${H.lerp(.8,1,sw)})`;
    $.mAllow.querySelector('.fr').style.opacity = (active===M && focused && t<M.swipe) ? 1 : 0;
    $.mAllow.querySelector('.fl').style.opacity = active===M ? 0.9*H.window(t,M.press,M.press+320,40,280) : 0;
    $.mAllow.style.transform = (active===M && t>=M.press && t<M.press+120) ? 'scale(.95)' : 'scale(1)';
    $.mDone.querySelector('.fr').style.opacity = (active===M && focused && t>=M.swipe+400) ? 1 : 0;
    $.mDone.querySelector('.fl').style.opacity = active===M ? 0.9*H.window(t,M.press2,M.press2+320,40,280) : 0;
    $.mDone.style.transform = (active===M && t>=M.press2 && t<M.press2+120) ? 'scale(.95)' : 'scale(1)';

    // ---- cursor ----
    const path=[
      {t:0,     x:1010,y:610},
      {t:15600, x:1010,y:610},
      {t:16500, x:760, y:300},
      {t:17300, x:o1.x,y:o1.y},
      {t:18900, x:o1.x,y:o1.y},
      {t:19800, x:1010,y:610}
    ];
    H.cursor(t,(t<2300||t>38900)?[]:path,[B.click]);   // hide the cursor under title/end cards

    // ---- captions ----
    H.caption(t,[
      {from:2500,  to:5800,  text:"You're watching a talk, fullscreen. Two Claude Code sessions run in the background."},
      {from:6500,  to:10400, text:"Claude needs permission. The island unfolds from the notch — your video keeps playing."},
