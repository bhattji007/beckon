# Builds, signs, notarizes and publishes Beckon when a tag like v0.9.0 is pushed.
#
# Secrets (Settings > Secrets and variables > Actions). All optional: without them the job still
# builds and uploads an UNSIGNED dmg/zip (marked as such in the release notes).
#   BECKON_P12_BASE64        Developer ID Application certificate + private key, .p12, base64-encoded
#                            (base64 -i Certificates.p12 | pbcopy)
#   BECKON_P12_PASSWORD      password chosen when exporting the .p12
#   BECKON_NOTARY_KEY_P8     contents of the App Store Connect API key file (AuthKey_XXXXXXXXXX.p8)
#   BECKON_NOTARY_KEY_ID     the 10-character Key ID
#   BECKON_NOTARY_ISSUER_ID  the Issuer ID (UUID) shown above the keys table
# Variables (optional):
#   BECKON_DOWNLOAD_BASE     base URL for appcast.json, default https://beckon.shubham.club/releases
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-15
    timeout-minutes: 60
    env:
      KEYCHAIN_PATH: ${{ github.workspace }}/.ci/beckon-build.keychain-db
      P12_BASE64: ${{ secrets.BECKON_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.BECKON_P12_PASSWORD }}
      NOTARY_KEY_P8: ${{ secrets.BECKON_NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.BECKON_NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.BECKON_NOTARY_ISSUER_ID }}
      BECKON_DOWNLOAD_BASE: ${{ vars.BECKON_DOWNLOAD_BASE || 'https://beckon.shubham.club/releases' }}

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          xcrun --find swiftc && swiftc --version
          xcrun notarytool --version

      - name: Check tag matches app/Info.plist version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app/Info.plist)"
          echo "tag=$TAG plist=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error title=Version mismatch::Tag v$TAG does not match CFBundleShortVersionString $VER in app/Info.plist. Bump the plist (or retag) and push again."
            exit 1
          fi

      # ---- temporary keychain with the Developer ID certificate (only if the secret exists) ----
      - name: Import Developer ID certificate
        id: cert
        if: env.P12_BASE64 != ''
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$KEYCHAIN_PATH")"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          P12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          # let codesign use the key without a UI prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
                      | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "::error title=No Developer ID identity::The .p12 was imported but contains no 'Developer ID Application' certificate."
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi
          echo "Using identity: $IDENTITY"
          echo "BECKON_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Store notarytool credentials
        if: env.P12_BASE64 != '' && env.NOTARY_KEY_P8 != '' && env.NOTARY_KEY_ID != '' && env.NOTARY_ISSUER_ID != ''
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s\n' "$NOTARY_KEY_P8" > "$KEY"
          xcrun notarytool store-credentials beckon-ci \
            --key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH" --no-validate
          rm -f "$KEY"
          echo "BECKON_NOTARY_PROFILE=beckon-ci" >> "$GITHUB_ENV"
          echo "BECKON_NOTARY_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Signing status
        run: |
          if [ -n "${BECKON_SIGN_IDENTITY:-}" ]; then echo "Signing with: $BECKON_SIGN_IDENTITY"; else echo "::warning title=Unsigned build::BECKON_P12_BASE64 secret not set; producing an ad-hoc signed artifact."; fi
          if [ -n "${BECKON_NOTARY_PROFILE:-}" ]; then echo "Notarizing with profile: $BECKON_NOTARY_PROFILE"; else echo "::warning title=Not notarized::Notary secrets not set; skipping notarization."; fi
          echo "SIGNED=$([ -n "${BECKON_SIGN_IDENTITY:-}" ] && echo yes || echo no)" >> "$GITHUB_ENV"
          echo "NOTARIZED=$([ -n "${BECKON_NOTARY_PROFILE:-}" ] && echo yes || echo no)" >> "$GITHUB_ENV"

      - name: Build, sign, package, notarize
        run: release/release.sh

      - name: Delete temporary keychain
        if: always() && env.P12_BASE64 != ''
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: beckon-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error

      - name: Compose release notes
        id: notes
        run: |
          set -euo pipefail
          VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app/Info.plist)"
          {
            if [ -f release/NOTES.md ]; then cat release/NOTES.md; echo; fi
            echo
            if [ "$SIGNED" = yes ] && [ "$NOTARIZED" = yes ]; then
              echo "Signed with Developer ID and notarized by Apple. Open the dmg and drag Beckon to Applications."
            elif [ "$SIGNED" = yes ]; then
              echo "> **Signed but not notarized.** macOS will warn on first launch; see the Gatekeeper note on the download page."
            else
              echo "> **Unsigned build.** macOS will say the app cannot be verified. Right-click > Open, or System Settings > Privacy & Security > Open Anyway. Requires macOS 14+."
            fi
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > "$RUNNER_TEMP/release-notes.md"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Beckon ${{ steps.notes.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/appcast.json
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
